# Put a TLS reverse proxy in front of 127.0.0.1:8080. No database ports are published.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]
    command: redis-server --appendonly yes
  api:
    build: {context: ./api, dockerfile: Dockerfile.production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      MONGO_URI: mongodb://mongo:27017/genesis
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      CONNECTOR_ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY:?Set CONNECTOR_ENCRYPTION_KEY}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set the public HTTPS origin}
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    depends_on:
      mongo: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build: {context: ./web, dockerfile: Dockerfile.production}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/genesis
      API_CALLBACK_URL: http://api:3001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      LLM_PROVIDER: ${LLM_PROVIDER:-fallback}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      mongo: {condition: service_healthy}
  minio:
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes: [minio-data:/data]
volumes:
  mongo-data:
  redis-data:
  minio-data:
